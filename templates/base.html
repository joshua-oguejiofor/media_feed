{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}MediaFeed{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'styles/style.css' %}">
</head>
<body>
  <nav>
    <a href="{% url 'feed' %}" class="brand">MediaFeed</a>
    <div>
      {% if user.is_authenticated %}
        <a href="{% url 'create_post' %}">+ Post</a>
        <a href="{% url 'profile' user.username %}">{{ user.username }}</a>
        <form class="inline" method="post" action="{% url 'logout' %}">{% csrf_token %}<button type="submit">Logout</button>
        </form>
      {% else %}
        <a href="{% url 'login' %}">Log in</a>
        <a href="{% url 'signup' %}">Sign up</a>
      {% endif %}
    </div>
  </nav>
  <div class="container">
    
    {% block content %}{% endblock %}
  </div>
</body>
</html>
